<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCFI Own SIM Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dbe3ef;
        --text: #172033;
        --muted: #667085;
        --primary: #0f5bd7;
        --primary-dark: #0b48ad;
        --ok: #047857;
        --fail: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 18px clamp(18px, 4vw, 42px);
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.1;
      }

      h1 {
        font-size: clamp(1.45rem, 3vw, 2.2rem);
      }

      main {
        display: grid;
        width: min(1120px, 100%);
        margin: 0 auto;
        gap: 18px;
        padding: clamp(18px, 4vw, 42px);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 18px;
        box-shadow: 0 12px 30px rgba(15, 35, 70, 0.06);
      }

      label {
        display: grid;
        gap: 7px;
        margin-top: 13px;
        color: #344054;
        font-size: 0.92rem;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #c8d3e1;
        border-radius: 7px;
        padding: 11px 12px;
        color: var(--text);
        font: inherit;
      }

      textarea {
        min-height: 124px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 7px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 11px 14px;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .secondary {
        border: 1px solid #c8d3e1;
        background: #fff;
        color: var(--text);
      }

      .secondary:hover {
        background: #eef4ff;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .muted {
        color: var(--muted);
      }

      .status {
        margin-top: 13px;
        border-radius: 7px;
        background: #f8fafc;
        color: var(--muted);
        min-height: 44px;
        padding: 11px 12px;
        white-space: pre-wrap;
      }

      .status.ok {
        background: #ecfdf3;
        color: var(--ok);
      }

      .status.fail {
        background: #fef3f2;
        color: var(--fail);
      }

      .wide {
        grid-column: 1 / -1;
      }

      @media (max-width: 760px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>CCFI Own SIM Gateway</h1>
        <p class="muted">Test SMS and click-to-call through your own SIM gateway.</p>
      </div>
      <button class="secondary" type="button" onclick="signOut()">Sign out</button>
    </header>

    <main>
      <section id="loginPanel">
        <h2>Login</h2>
        <label>
          Email
          <input id="email" type="email" autocomplete="username" />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" />
        </label>
        <div class="actions">
          <button type="button" onclick="signIn()">Login</button>
        </div>
        <div id="loginStatus" class="status"></div>
      </section>

      <div id="gatewayPanel" class="grid" hidden>
        <section class="wide">
          <h2>Gateway Health</h2>
          <p class="muted">Checks the Supabase function and your own SIM gateway server.</p>
          <div class="actions">
            <button type="button" onclick="testGateway()">Test Gateway</button>
          </div>
          <div id="healthStatus" class="status"></div>
        </section>

        <section>
          <h2>Send SMS</h2>
          <label>
            PN / Account
            <input id="smsPn" placeholder="Optional account PN" />
          </label>
          <label>
            Recipient Number
            <input id="smsPhone" type="tel" placeholder="09XXXXXXXXX" />
          </label>
          <label>
            Message
            <textarea id="smsMessage" maxlength="480" placeholder="Type the message here"></textarea>
          </label>
          <div class="actions">
            <button type="button" onclick="sendSms()">Send SMS</button>
          </div>
          <div id="smsStatus" class="status"></div>
        </section>

        <section>
          <h2>Start Call</h2>
          <p class="muted">This starts a cellular call on the SIM gateway phone. Voice audio stays on that phone.</p>
          <label>
            PN / Account
            <input id="callPn" placeholder="Optional account PN" />
          </label>
          <label>
            Recipient Number
            <input id="callPhone" type="tel" placeholder="09XXXXXXXXX" />
          </label>
          <div class="actions">
            <button type="button" onclick="startCall()">Start Call</button>
          </div>
          <div id="callStatus" class="status"></div>
        </section>
      </div>
    </main>

    <script>
      const SUPABASE_URL = "https://kreyfgipofhxwpcwvkuz.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tlyDDbuqPa86wOL5erFhpg_bvjuM0JO";
      const GATEWAY_FUNCTION = "sim-gateway";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      function setStatus(id, message, ok = null) {
        const element = document.getElementById(id);
        element.textContent = typeof message === "string" ? message : JSON.stringify(message, null, 2);
        element.className = "status" + (ok === true ? " ok" : ok === false ? " fail" : "");
      }

      async function signIn() {
        setStatus("loginStatus", "Logging in...");
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          setStatus("loginStatus", error.message, false);
          return;
        }
        setStatus("loginStatus", "Logged in.", true);
        await refreshSession();
      }

      async function signOut() {
        await supabaseClient.auth.signOut();
        await refreshSession();
      }

      async function refreshSession() {
        const { data } = await supabaseClient.auth.getSession();
        const loggedIn = Boolean(data.session);
        document.getElementById("loginPanel").hidden = loggedIn;
        document.getElementById("gatewayPanel").hidden = !loggedIn;
      }

      async function invokeGateway(payload, statusId) {
        setStatus(statusId, "Sending request...");
        const { data, error } = await supabaseClient.functions.invoke(GATEWAY_FUNCTION, { body: payload });
        if (error) {
          setStatus(statusId, error.message || String(error), false);
          return null;
        }
        setStatus(statusId, data, Boolean(data?.ok));
        return data;
      }

      async function testGateway() {
        await invokeGateway({ mode: "health" }, "healthStatus");
      }

      async function sendSms() {
        await invokeGateway(
          {
            action: "sms",
            pn: document.getElementById("smsPn").value.trim(),
            phoneNumber: document.getElementById("smsPhone").value.trim(),
            message: document.getElementById("smsMessage").value.trim(),
          },
          "smsStatus",
        );
      }

      async function startCall() {
        await invokeGateway(
          {
            action: "call",
            pn: document.getElementById("callPn").value.trim(),
            phoneNumber: document.getElementById("callPhone").value.trim(),
          },
          "callStatus",
        );
      }

      supabaseClient.auth.onAuthStateChange(refreshSession);
      refreshSession();
    </script>
  </body>
</html>
